# Keeps the SHA-pinned actions current: action.yml (the action itself) and
# .github/workflows/. Updates arrive as one grouped PR a week.
#
# The actionlint and shellcheck images in ci.yml are pinned by digest and
# bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
